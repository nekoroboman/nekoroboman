<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>年間スケジュール（印刷用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<style>
  :root {
    --ink: #1d1d1f;
    --muted: #5f5f64;
    --line: #c9c6c0;
    --accent: #d1343a;
    --accent-soft: #fdeceb;
    --teal: #1f7a6b;
    font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #e9e7e3; }

  /* 画面用ツールバー（印刷時は非表示） */
  .toolbar {
    position: sticky; top: 0; z-index: 1;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px;
    background: #fff; border-bottom: 1px solid #dddad5;
  }
  .toolbar .spacer { flex: 1; }
  .toolbar .source { width: 100%; margin: 0; font-size: 12px; color: var(--muted); }
  .toolbar a, .toolbar button, .toolbar select {
    font: inherit; font-size: 14px; color: var(--ink); text-decoration: none; cursor: pointer;
    border: 1px solid #dddad5; background: #fff; border-radius: 8px; padding: 7px 12px;
  }
  .toolbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* A4縦 1枚 */
  @page { size: A4 portrait; margin: 0; }
  .sheet {
    width: 210mm; height: 297mm; margin: 16px auto; padding: 13mm 13mm 11mm;
    background: #fff; display: flex; flex-direction: column;
    box-shadow: 0 4px 24px rgba(0,0,0,.12);
  }
  @media screen { .sheet { zoom: var(--fit, 1); } }

  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8mm; padding-bottom: 3.5mm; border-bottom: 1.2mm solid var(--ink); }
  .brand { margin: 0; font-size: 9pt; font-weight: 700; color: var(--accent); letter-spacing: .12em; }
  h1 { margin: .6mm 0 0; font-size: 17pt; line-height: 1.25; font-weight: 800; letter-spacing: .03em; white-space: nowrap; }
  .period { margin: 1mm 0 0; font-size: 11pt; font-weight: 500; }
  .office { border-collapse: collapse; font-size: 9pt; flex: none; }
  .office th { font-weight: 500; color: var(--muted); text-align: left; padding: 1.2mm 2.5mm 1.2mm 0; white-space: nowrap; }
  .office td { width: 46mm; border-bottom: .3mm solid var(--ink); }

  .plan { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 4mm; }
  .plan col.c-month { width: 15mm; }
  .plan col.c-committee { width: 37mm; }
  .plan col.c-check { width: 16mm; }
  .plan thead th {
    background: var(--ink); color: #fff; font-size: 8.5pt; font-weight: 700; text-align: left;
    padding: 1.8mm 2.2mm; border: .3mm solid var(--ink); white-space: nowrap;
  }
  .plan thead th.req { background: var(--accent); border-color: var(--accent); }
  .plan thead th.committee { background: var(--teal); border-color: var(--teal); }
  .plan thead th:first-child, .plan thead th:last-child { text-align: center; padding-left: .5mm; padding-right: .5mm; }
  .plan tbody tr { height: 17.6mm; }
  .plan tbody tr:nth-child(even) td, .plan tbody tr:nth-child(even) th { background: #f7f6f4; }
  .plan tbody th, .plan tbody td { border: .3mm solid var(--line); vertical-align: middle; }
  .plan tbody th { text-align: center; font-weight: 800; line-height: 1.15; }
  .plan tbody th .m { display: block; font-size: 14pt; }
  .plan tbody th .y { display: block; font-size: 7pt; font-weight: 500; color: var(--muted); }
  .plan tbody td { padding: 1.4mm 2.2mm; }
  .plan .theme { display: block; font-size: 9.5pt; font-weight: 700; line-height: 1.35; }
  .plan .video { display: block; margin-top: .5mm; font-size: 8pt; color: var(--muted); line-height: 1.35; }
  .plan .cm { display: block; font-size: 8pt; font-weight: 700; line-height: 1.35; }
  .plan .cm + .cm { margin-top: 1mm; }
  .plan .cm small { font-size: 7pt; font-weight: 500; color: var(--muted); margin-right: .8mm; }
  .plan .none { color: #a5a5aa; font-size: 9pt; }
  .plan td.check { background: #fff !important; }

  .foot { margin-top: auto; padding-top: 3mm; display: flex; align-items: flex-end; justify-content: space-between; gap: 6mm; font-size: 8pt; color: var(--muted); line-height: 1.55; }
  .foot p { margin: 0; }
  .foot b { color: var(--ink); }
  .foot .issuer { flex: none; font-weight: 500; color: var(--ink); text-align: right; }

  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .sheet { margin: 0; box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <a href="index.html" id="back">← サイト版へ</a>
  <select id="year" aria-label="年度"></select>
  <span class="spacer"></span>
  <button type="button" class="primary" id="print">印刷 / PDFに保存</button>
  <p class="source" id="source">読み込み中…</p>
</div>

<article class="sheet" id="sheet" hidden>
  <header class="head">
    <div>
      <p class="brand">ネコロボグループ</p>
      <h1>年間研修・委員会スケジュール</h1>
      <p class="period" id="period"></p>
    </div>
    <table class="office">
      <tr><th>事業所名</th><td></td></tr>
      <tr><th>管理者</th><td></td></tr>
    </table>
  </header>

  <table class="plan">
    <colgroup><col class="c-month"><col><col><col class="c-committee"><col class="c-check"></colgroup>
    <thead>
      <tr>
        <th>月</th>
        <th class="req">研修項目①（必須研修）</th>
        <th>研修項目②</th>
        <th class="committee">委員会（本部標準）</th>
        <th>管理者確認</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <footer class="foot">
    <div>
      <p><b>研修</b>　ウェルビーラーニングの「必須研修」から当月の①・②を視聴 → 研修テスト・感想に回答 →「済」を確認</p>
      <p><b>委員会</b>　本部が定める標準の開催月です。開催後は議事録と回覧板サインまで完了してください。</p>
      <p>本表は事業所内に掲示し、研修・委員会の記録とあわせて保管してください。</p>
    </div>
    <p class="issuer">発行：ネコロボグループ本部<br><span id="printed"></span></p>
  </footer>
</article>

<script src="config.js"></script>
<script src="data/wellbe-learning.js"></script>
<script src="data/committees.js"></script>
<script src="assets/calendar.js"></script>
<script>
(async () => {
  const { MONTHS, yearOf, fyLabel, currentFiscalYear, h, load, sourceText } = window.NekoroboCalendar;
  const $ = (id) => document.getElementById(id);

  const data = await load();
  $('source').textContent = sourceText(data);
  if (!data.years.length) {
    $('source').textContent = 'スケジュールのデータを読み込めませんでした。data/ と config.js を確認してください。';
    return;
  }

  function pickFy() {
    const fromHash = Number((location.hash.match(/fy=(\d{4})/) || [])[1]);
    if (data.years.includes(fromHash)) return fromHash;
    const current = currentFiscalYear();
    return data.years.includes(current) ? current : data.years[data.years.length - 1];
  }

  const wellbeCell = (item, cls) => h('td', { class: cls },
    item ? [h('span', { class: 'theme' }, item.theme), h('span', { class: 'video' }, item.video)]
         : h('span', { class: 'none' }, '—'));

  const committeeCell = (list) => h('td', {},
    list.length ? list.map((c) => h('span', { class: 'cm' }, c.round ? h('small', {}, c.round) : null, c.title))
                : h('span', { class: 'none' }, '—'));

  function render(fy) {
    $('year').value = String(fy);
    $('back').href = `index.html#fy=${fy}`;
    $('period').textContent = `${fyLabel(fy)}（${fy}年4月〜${fy + 1}年3月）`;
    document.title = `年間スケジュール_${fyLabel(fy)}`;
    $('rows').replaceChildren(...MONTHS.map((m) => {
      const items = data.wellbeOf(fy, m);
      return h('tr', {},
        h('th', { scope: 'row' }, h('span', { class: 'm' }, `${m}月`), h('span', { class: 'y' }, String(yearOf(fy, m)))),
        wellbeCell(items[0], 'req'),
        wellbeCell(items[1], ''),
        committeeCell(data.committeesOf(fy, m)),
        h('td', { class: 'check' }));
    }));
  }

  // 画面幅に合わせて用紙を縮小表示（印刷には影響しない）
  function fit() {
    const paper = 210 * 96 / 25.4;
    document.documentElement.style.setProperty('--fit', String(Math.min(1, (window.innerWidth - 16) / paper)));
  }

  const now = new Date();
  $('printed').textContent = `出力日：${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;
  $('year').replaceChildren(...data.years.map((y) => h('option', { value: String(y) }, fyLabel(y))));
  $('year').addEventListener('change', (e) => { history.replaceState(null, '', `#fy=${e.target.value}`); render(Number(e.target.value)); });
  $('print').addEventListener('click', () => window.print());
  window.addEventListener('hashchange', () => render(pickFy()));
  window.addEventListener('resize', fit);

  fit();
  render(pickFy());
  $('sheet').hidden = false;
  // PDF書き出しツール（tools/make-pdf.js）はこの印を待ってから出力する
  document.body.dataset.years = data.years.join(',');
  await document.fonts.ready;
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
