<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>年間スケジュール｜ネコロボグループ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<style>
  :root {
    --bg: #f6f5f3;
    --surface: #ffffff;
    --ink: #1d1d1f;
    --muted: #6b6b70;
    --line: #e3e1dd;
    --accent: #d1343a;
    --accent-soft: #fdeceb;
    --teal: #1f7a6b;
    --teal-soft: #e3f2ef;
    --radius: 12px;
    font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); line-height: 1.6; }
  button, select, .btn {
    font: inherit; font-size: 14px; color: var(--ink); text-decoration: none; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:hover, select:hover, .btn:hover { border-color: #c9c6c0; }
  button:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #b92c32; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 48px; }

  /* ヘッダー */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; padding: 28px 0 16px; border-bottom: 3px solid var(--ink); }
  .top .heading { flex: 1 1 320px; }
  .brand { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .08em; }
  h1 { margin: 2px 0 0; font-size: 26px; line-height: 1.3; letter-spacing: .02em; font-weight: 800; }
  h1 small { display: inline-block; margin-left: .5em; font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .year-nav { display: flex; gap: 6px; }
  .year-nav button { width: 40px; padding: 8px 0; font-size: 18px; line-height: 1; }
  .year-nav select { font-weight: 700; padding-right: 10px; }

  .subbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-top: 14px; }
  .period { margin: 0; color: var(--muted); font-size: 15px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }

  .notice { margin-top: 16px; padding: 14px 16px; border-radius: 8px; background: var(--surface); border: 1px dashed #c9c6c0; color: var(--muted); font-size: 14px; }

  /* 表示の切り替え */
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; }
  .filters .label { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .filters button { padding: 5px 12px; border-radius: 999px; font-size: 13px; }
  .filters button[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .dot.committee { background: var(--teal); }

  /* 今月・来月 */
  .now { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 16px; }
  .now-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 16px; }
  .now-card.is-current { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
  .now-card h2 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 500; }
  .now-card h2 strong { color: var(--ink); font-size: 18px; margin-right: 6px; font-weight: 800; }
  .now-card .theme { font-size: 15px; }

  /* 12か月 */
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .month { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 14px; display: flex; flex-direction: column; }
  .month header { display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
  .month .m { font-size: 22px; font-weight: 800; line-height: 1; }
  .month .y { font-size: 12px; color: var(--muted); }
  .month.is-current { border-color: var(--accent); border-width: 2px; padding: 11px 13px 13px; }
  .month.is-current .m { color: var(--accent); }
  .month.is-past { background: #faf9f7; }
  .month.is-past .m { color: #9a9aa0; }
  .badge { font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 4px; padding: 1px 6px; align-self: center; }

  .items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .item { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: baseline; }
  .tag { grid-row: span 2; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; background: #efeeeb; color: #55555a; white-space: nowrap; }
  .item.is-required .tag { background: var(--accent-soft); color: var(--accent); }
  .item.is-committee .tag { background: var(--teal-soft); color: var(--teal); }
  .item:not(.is-committee) + .item.is-committee { padding-top: 10px; border-top: 1px dashed var(--line); }
  .theme { font-size: 14px; font-weight: 700; word-break: break-word; }
  .video { font-size: 12.5px; color: var(--muted); word-break: break-word; }
  .none { margin: 0; font-size: 13px; color: #a5a5aa; }

  /* 視聴方法・データの出どころ */
  .howto { margin-top: 24px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .howto h2 { margin: 0 0 6px; font-size: 14px; }
  .howto ol { margin: 0; padding-left: 1.4em; font-size: 13px; color: var(--muted); }
  .howto p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .source { margin: 16px 0 0; font-size: 12px; color: var(--muted); }

  .loading { margin-top: 24px; color: var(--muted); font-size: 14px; }

  @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } h1 { font-size: 22px; } }
  @media (max-width: 520px)  { .grid { grid-template-columns: 1fr; } h1 small { display: block; margin-left: 0; } .year-nav { width: 100%; } .year-nav select { flex: 1; } }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    body { background: #fff; font-size: 11px; }
    .wrap { max-width: none; padding: 0; }
    .year-nav, .actions, .notice, .filters, .now, .howto, .source { display: none !important; }
    .top { padding: 0 0 6px; }
    .grid { gap: 6px; margin-top: 8px; }
    .month, .month.is-current, .month.is-past { padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px; break-inside: avoid; background: #fff; }
    .month .m, .month.is-current .m, .month.is-past .m { font-size: 15px; color: var(--ink); }
    .badge { display: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="heading">
      <div class="brand">ネコロボグループ</div>
      <h1>年間スケジュール<small>ウェルビーラーニング研修・委員会</small></h1>
    </div>
    <nav class="year-nav" aria-label="年度の切り替え" hidden>
      <button type="button" id="prev" aria-label="前の年度">‹</button>
      <select id="year" aria-label="年度"></select>
      <button type="button" id="next" aria-label="次の年度">›</button>
    </nav>
  </header>

  <div class="subbar" hidden>
    <p class="period" id="period"></p>
    <div class="actions">
      <a class="btn primary" id="pdf-link" hidden>PDFをダウンロード（A4・1枚）</a>
      <a class="btn" id="print-link">印刷 / PDF用ページ</a>
    </div>
  </div>

  <p class="loading" id="loading">読み込み中…</p>
  <p class="notice" id="error" hidden>スケジュールのデータを読み込めませんでした。data/ と config.js が同じフォルダ構成で置かれているか確認してください。</p>

  <div class="filters" role="group" aria-label="表示する項目" hidden>
    <span class="label">表示</span>
    <button type="button" data-kind="wellbe" aria-pressed="true"><span class="dot"></span>ウェルビーラーニング研修</button>
    <button type="button" data-kind="committee" aria-pressed="true"><span class="dot committee"></span>委員会（本部標準）</button>
  </div>

  <section class="now" id="now" aria-label="今月と来月の予定" hidden></section>
  <main class="grid" id="grid"></main>

  <section class="howto" hidden>
    <h2>ウェルビーラーニングの視聴のしかた</h2>
    <ol>
      <li>ウェルビーラーニングを開き「必須研修」から、その月の研修項目①・②の動画を視聴する</li>
      <li>視聴後に研修テストと感想に回答する</li>
      <li>研修が「済」になっていることを確認する</li>
    </ol>
    <p>委員会は本部が定める標準の開催月です。</p>
  </section>
  <p class="source" id="source"></p>
</div>

<script src="config.js"></script>
<script src="data/wellbe-learning.js"></script>
<script src="data/committees.js"></script>
<script src="pdf/index.js"></script>
<script src="assets/calendar.js"></script>
<script>
(async () => {
  const { MONTHS, yearOf, fyLabel, currentFiscalYear, h, load, sourceText } = window.NekoroboCalendar;
  const $ = (id) => document.getElementById(id);

  const data = await load();
  $('loading').hidden = true;
  $('source').textContent = sourceText(data);
  if (!data.years.length) {
    $('error').hidden = false;
    return;
  }
  for (const sel of ['.year-nav', '.subbar', '.filters', '.howto']) document.querySelector(sel).hidden = false;

  const show = { wellbe: true, committee: true };
  const today = new Date();
  const currentFy = currentFiscalYear(today);
  const currentMonth = today.getMonth() + 1;
  let fy = initialFy();

  function initialFy() {
    const fromHash = Number((location.hash.match(/fy=(\d{4})/) || [])[1]);
    if (data.years.includes(fromHash)) return fromHash;
    if (data.years.includes(currentFy)) return currentFy;
    const past = data.years.filter((y) => y <= currentFy);
    return past.length ? past[past.length - 1] : data.years[data.years.length - 1];
  }

  function itemList(year, m) {
    const rows = [];
    if (show.wellbe) {
      data.wellbeOf(year, m).forEach((it, i) => {
        if (!it) return;
        rows.push(h('li', { class: 'item' + (i === 0 ? ' is-required' : '') },
          h('span', { class: 'tag' }, i === 0 ? '①必須' : '②'),
          h('span', { class: 'theme' }, it.theme),
          h('span', { class: 'video' }, it.video)));
      });
    }
    if (show.committee) {
      data.committeesOf(year, m).forEach((c) => {
        rows.push(h('li', { class: 'item is-committee' },
          h('span', { class: 'tag' }, '委員会'),
          h('span', { class: 'theme' }, c.title),
          h('span', { class: 'video' }, c.round)));
      });
    }
    return rows.length ? h('ul', { class: 'items' }, rows) : h('p', { class: 'none' }, '予定なし');
  }

  function render() {
    const index = data.years.indexOf(fy);
    $('year').value = String(fy);
    $('prev').disabled = index <= 0;
    $('next').disabled = index >= data.years.length - 1;
    $('period').textContent = `${fyLabel(fy)}（${fy}年4月〜${fy + 1}年3月）`;
    document.title = `年間スケジュール ${fyLabel(fy)}｜ネコロボグループ`;

    const pdf = data.pdfOf(fy);
    $('pdf-link').hidden = !pdf;
    if (pdf) {
      $('pdf-link').href = pdf;
      $('pdf-link').setAttribute('download', `年間スケジュール_${fyLabel(fy)}.pdf`);
    }
    $('print-link').href = `print.html#fy=${fy}`;

    // 今月・来月（表示中の年度が今年度のときだけ）
    const isCurrentFy = fy === currentFy;
    const nowIndex = isCurrentFy ? MONTHS.indexOf(currentMonth) : -1;
    const nowEl = $('now');
    nowEl.replaceChildren();
    if (isCurrentFy) {
      const next = currentMonth === 3 ? { fy: fy + 1, m: 4 } : { fy, m: currentMonth % 12 + 1 };
      [{ fy, m: currentMonth, label: '今月の予定' }, { ...next, label: '来月の予定' }].forEach((ref, i) => {
        nowEl.append(h('div', { class: 'now-card' + (i === 0 ? ' is-current' : '') },
          h('h2', {}, h('strong', {}, `${ref.m}月`), ref.label),
          itemList(ref.fy, ref.m)));
      });
    }
    nowEl.hidden = !isCurrentFy;

    const fyEnded = fy < currentFy;
    $('grid').replaceChildren(...MONTHS.map((m, i) => {
      const isCurrent = i === nowIndex;
      const isPast = fyEnded || (nowIndex !== -1 && i < nowIndex);
      return h('section', { class: 'month' + (isCurrent ? ' is-current' : '') + (isPast ? ' is-past' : ''), 'aria-label': `${m}月` },
        h('header', {},
          h('span', { class: 'm' }, `${m}月`),
          h('span', { class: 'y' }, String(yearOf(fy, m))),
          isCurrent ? h('span', { class: 'badge' }, '今月') : null),
        itemList(fy, m));
    }));
  }

  function go(year) {
    if (!data.years.includes(year)) return;
    fy = year;
    history.replaceState(null, '', `#fy=${fy}`);
    render();
  }

  $('year').replaceChildren(...data.years.map((y) => h('option', { value: String(y) }, `${fyLabel(y)}（${y}）`)));
  $('year').addEventListener('change', (e) => go(Number(e.target.value)));
  $('prev').addEventListener('click', () => go(data.years[data.years.indexOf(fy) - 1]));
  $('next').addEventListener('click', () => go(data.years[data.years.indexOf(fy) + 1]));
  document.querySelectorAll('.filters button').forEach((btn) => btn.addEventListener('click', () => {
    show[btn.dataset.kind] = !show[btn.dataset.kind];
    btn.setAttribute('aria-pressed', String(show[btn.dataset.kind]));
    render();
  }));
  window.addEventListener('hashchange', () => { fy = initialFy(); render(); });

  render();
})();
</script>
</body>
</html>
