<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
/* ===== 色（ライト／ダーク） ===== */
:root {
  --bg: #f8fafd; --surface: #ffffff; --surface2: #f0f4f9; --hover: rgba(68, 71, 70, .08);
  --text: #1f1f1f; --text2: #444746; --muted: #747775; --line: #e1e3e1;
  --primary: #0b57d0; --on-primary: #ffffff; --primary-soft: #d3e3fd; --on-primary-soft: #041e49;
  --red: #b3261e; --red-soft: #fce8e6; --orange: #a35a00; --orange-soft: #feefc3; --green: #146c2e; --green-soft: #c4eed0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
  --shadow2: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3);
  --snack: #303030; --on-snack: #f2f2f2; --snack-action: #a8c7fa;
  color-scheme: light;
}
.app[data-theme="dark"] {
  --bg: #131314; --surface: #1e1f20; --surface2: #282a2c; --hover: rgba(227, 227, 227, .08);
  --text: #e3e3e3; --text2: #c4c7c5; --muted: #8e918f; --line: #3c4043;
  --primary: #a8c7fa; --on-primary: #062e6f; --primary-soft: #0842a0; --on-primary-soft: #d3e3fd;
  --red: #f2b8b5; --red-soft: #601410; --orange: #ffb95c; --orange-soft: #4a2800; --green: #6dd58c; --green-soft: #0f5223;
  --snack: #e3e3e3; --on-snack: #303030; --snack-action: #0b57d0;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  .app[data-theme="auto"] {
    --bg: #131314; --surface: #1e1f20; --surface2: #282a2c; --hover: rgba(227, 227, 227, .08);
    --text: #e3e3e3; --text2: #c4c7c5; --muted: #8e918f; --line: #3c4043;
    --primary: #a8c7fa; --on-primary: #062e6f; --primary-soft: #0842a0; --on-primary-soft: #d3e3fd;
    --red: #f2b8b5; --red-soft: #601410; --orange: #ffb95c; --orange-soft: #4a2800; --green: #6dd58c; --green-soft: #0f5223;
    --snack: #e3e3e3; --on-snack: #303030; --snack-action: #0b57d0;
    color-scheme: dark;
  }
}

/* ===== 土台 ===== */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", Roboto, sans-serif; font-size: 14px; background: #f8fafd; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: .45; }
.ic { width: 20px; height: 20px; fill: currentColor; flex: none; display: block; }
.muted { color: var(--muted); }
.grow { flex: 1; }
.boot { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #5f6368; }
.boot-spin { width: 36px; height: 36px; border: 4px solid #d3e3fd; border-top-color: #0b57d0; border-radius: 50%; animation: spin 1s linear infinite; }
.boot-error { max-width: 480px; padding: 24px; text-align: center; line-height: 1.7; }
@keyframes spin { to { transform: rotate(360deg); } }

.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); overflow: hidden; }
.app.no-motion *, .app.no-motion *::before, .app.no-motion *::after { animation-duration: 0s !important; transition-duration: 0s !important; }

.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--text2); flex: none; }
.icon-btn:hover { background: var(--hover); }
.icon-btn.sm { width: 32px; height: 32px; }
.icon-btn.sm .ic { width: 18px; height: 18px; }

.btn { height: 40px; padding: 0 20px; border-radius: 20px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.primary:hover { box-shadow: var(--shadow); }
.btn.tonal { background: var(--primary-soft); color: var(--on-primary-soft); }
.btn.text { color: var(--primary); padding: 0 12px; }
.btn.text:hover, .btn.outline:hover { background: var(--hover); }
.btn.outline { border: 1px solid var(--line); color: var(--primary); }
.btn.danger { background: var(--red); color: #fff; }
.btn.sm { height: 32px; padding: 0 14px; font-size: 13px; }

/* ===== 上の帯 ===== */
.topbar { height: 64px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 8px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-size: 20px; color: var(--text2); cursor: pointer; white-space: nowrap; }
.brand svg { width: 34px; height: 34px; }
.search { flex: 1; min-width: 0; max-width: 640px; margin-left: 48px; height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; border-radius: 24px; background: var(--surface2); color: var(--text2); }
.search:focus-within { background: var(--surface); box-shadow: var(--shadow); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 15px; }
.sync { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; padding: 0 8px; white-space: nowrap; }
.sync .ic { width: 18px; height: 18px; }
.sync.saving .ic { animation: spin 1.2s linear infinite; color: var(--primary); }
.sync.offline { color: var(--red); }
.who-chip { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 4px; border-radius: 20px; border: 1px solid var(--line); color: var(--text); max-width: 200px; }
.who-chip:hover { background: var(--hover); }
.who-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.avatar { border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; flex: none; line-height: 1; }
.avatar.none { background: var(--surface2) !important; color: var(--muted); }

/* ===== 本体 ===== */
.body { flex: 1; min-height: 0; display: flex; }
.main { flex: 1; min-width: 0; overflow: auto; }

/* ===== 左のメニュー ===== */
.nav { width: 268px; flex: none; overflow-y: auto; padding: 8px 12px 24px 0; }
.create-btn { margin: 4px 0 16px 8px; height: 56px; padding: 0 24px 0 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; color: var(--text); transition: box-shadow .2s; }
.create-btn:hover { box-shadow: var(--shadow2); background: var(--surface2); }
.create-btn .ic { width: 24px; height: 24px; color: var(--primary); }
.nav-item { width: 100%; height: 40px; display: flex; align-items: center; gap: 16px; padding: 0 12px 0 24px; border-radius: 0 20px 20px 0; color: var(--text2); text-align: left; font-weight: 500; }
.nav-item:hover { background: var(--hover); }
.nav-item.active { background: var(--primary-soft); color: var(--on-primary-soft); font-weight: 700; }
.nav-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .count { font-size: 12px; color: var(--muted); }
.nav-item .count.red { color: var(--red); font-weight: 700; }
.nav-sep { height: 1px; background: var(--line); margin: 12px 0 12px 24px; }
.nav-head { display: flex; align-items: center; width: 100%; height: 40px; padding: 0 12px 0 24px; color: var(--text2); font-weight: 600; }
.nav-head .ic { transition: transform .2s; }
.nav-head.closed .ic { transform: rotate(-90deg); }
.nav-list { display: flex; align-items: center; height: 40px; padding: 0 12px 0 20px; border-radius: 0 20px 20px 0; gap: 8px; color: var(--text2); }
.nav-list:hover { background: var(--hover); }
.nav-list.active { background: var(--primary-soft); color: var(--on-primary-soft); }
.nav-list.drop { box-shadow: inset 0 2px 0 var(--primary); }
.nav-list-name { flex: 1; min-width: 0; height: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-list .count { font-size: 12px; color: var(--muted); }
.cb { position: relative; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.cb input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.cb .box { width: 18px; height: 18px; border-radius: 3px; border: 2px solid var(--text2); display: flex; align-items: center; justify-content: center; }
.cb input:checked + .box { background: var(--primary); border-color: var(--primary); }
.cb input:checked + .box::after { content: ''; width: 5px; height: 10px; border: solid var(--on-primary); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.32); z-index: 30; }

/* ===== リスト（カード） ===== */
.board { display: flex; align-items: flex-start; gap: 16px; padding: 4px 24px 24px 12px; height: 100%; overflow-x: auto; }
.single { padding: 4px 24px 40px 12px; display: flex; justify-content: center; }
.card { width: 360px; flex: none; max-height: 100%; display: flex; flex-direction: column; background: var(--surface); border-radius: 16px; border: 1px solid var(--line); }
.card.wide { width: 100%; max-width: 760px; max-height: none; }
.card.drop-card { box-shadow: 0 0 0 2px var(--primary); }
.card-head { display: flex; align-items: center; gap: 4px; padding: 10px 6px 2px 20px; }
.card-title { flex: 1; margin: 0; font-size: 20px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-sub { padding: 0 20px 4px; font-size: 12px; color: var(--muted); }
.card-scroll { overflow-y: auto; min-height: 0; padding-bottom: 8px; }
.card.wide .card-scroll { overflow: visible; }
.add-task { display: flex; align-items: center; gap: 14px; width: 100%; height: 48px; padding: 0 20px; color: var(--primary); font-weight: 600; text-align: left; }
.add-task:hover { background: var(--hover); }
.add-task .ic { width: 24px; height: 24px; }
.new-list-card { width: 280px; flex: none; height: 64px; border: 2px dashed var(--line); border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--primary); font-weight: 600; }
.new-list-card:hover { background: var(--hover); }
.group-head { padding: 14px 20px 4px; font-size: 13px; font-weight: 700; color: var(--text2); }
.group-head.red { color: var(--red); }
.empty { padding: 28px 24px 32px; text-align: center; color: var(--text2); }
.empty svg { width: 160px; height: 120px; display: block; margin: 0 auto 12px; }
.empty .em-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }

/* ===== タスクの行 ===== */
.task { position: relative; display: flex; align-items: flex-start; gap: 6px; padding: 6px 4px 6px 12px; cursor: pointer; border-radius: 0; transition: background .15s; }
.task:hover { background: var(--hover); }
.task.selected { background: var(--primary-soft); }
.task.selected .t-title { color: var(--on-primary-soft); }
.task.sub { padding-left: 44px; }
.task.pending { opacity: .75; }
.task.flash { animation: flash 2.4s ease-out; }
@keyframes flash { 0%, 30% { background: var(--orange-soft); } 100% { background: transparent; } }
.task.drop-before::before { content: ''; position: absolute; left: 12px; right: 12px; top: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
.task-list.drop-end { box-shadow: inset 0 -2px 0 var(--primary); }
.task[draggable="true"] { cursor: grab; }
.task.dragging { opacity: .4; }

.check { position: relative; width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin-top: -4px; }
.check:hover { background: var(--hover); }
.check .circle { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--text2); transition: background .2s, border-color .2s, transform .2s; }
.check .tick { position: absolute; width: 16px; height: 16px; color: var(--primary); opacity: 0; transform: scale(.4); transition: opacity .15s, transform .2s; }
.check:hover .tick { opacity: 1; transform: scale(1); }
.task.is-done .check .circle, .task.completing .check .circle, .sub-row.done .check .circle { background: var(--primary); border-color: var(--primary); }
.task.is-done .check .tick, .task.completing .check .tick, .sub-row.done .check .tick { opacity: 1; transform: scale(1); color: var(--on-primary); }
.task.completing .check .circle { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
.task.completing { animation: completeOut .65s ease-in forwards; overflow: hidden; }
@keyframes completeOut { 0%, 45% { opacity: 1; max-height: 240px; } 100% { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; } }
.task.completing .t-title { text-decoration: line-through; color: var(--muted); }

.t-body { flex: 1; min-width: 0; padding-top: 2px; }
.t-title { font-size: 15px; line-height: 1.45; word-break: break-word; }
.task.is-done .t-title { text-decoration: line-through; color: var(--muted); }
.t-details { margin-top: 2px; font-size: 13px; color: var(--text2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
.t-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.t-meta:empty { display: none; }
.t-note { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; font-size: 13px; color: var(--text2); }
.t-note .ic { width: 16px; height: 16px; margin-top: 2px; color: var(--muted); }
.t-note .txt { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.t-note .muted { font-size: 11px; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); font-size: 12px; color: var(--text2); white-space: nowrap; max-width: 100%; }
.chip .ic { width: 14px; height: 14px; }
.chip.red { color: var(--red); border-color: var(--red); background: var(--red-soft); font-weight: 600; }
.chip.today { color: var(--orange); border-color: var(--orange); font-weight: 600; }
.chip.doing { background: var(--primary-soft); color: var(--on-primary-soft); border-color: transparent; }
.chip.list { background: var(--surface2); border-color: transparent; }
.chip.who { padding-left: 3px; }
.star, .more { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text2); flex: none; margin-top: -4px; }
.star:hover, .more:hover { background: var(--hover); }
.star { opacity: 0; }
.more { opacity: 0; }
.task:hover .star, .task:hover .more, .task.selected .star, .task.selected .more, .star.on { opacity: 1; }
.star.on { color: var(--primary); }
.star.on .ic { animation: starPop .3s ease-out; }
@keyframes starPop { 0% { transform: scale(.5) rotate(-30deg); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
@media (hover: none) { .star, .more { opacity: 1; } }

.done-sec { border-top: 1px solid var(--line); margin-top: 4px; }
.done-head { display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 20px; font-weight: 600; color: var(--text2); text-align: left; }
.done-head:hover { background: var(--hover); }

/* ===== 追加フォーム ===== */
.add-form { display: flex; gap: 6px; padding: 8px 16px 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.add-form .ph { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex: none; }
.add-form .ph span { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); }
.af-body { flex: 1; min-width: 0; }
.af-title, .af-details { width: 100%; border: 0; outline: 0; background: transparent; padding: 6px 0; }
.af-title { font-size: 15px; }
.af-details { font-size: 13px; color: var(--text2); padding-top: 0; }
.af-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; align-items: center; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); color: var(--text2); font-size: 13px; }
.chip-btn:hover { background: var(--hover); }
.chip-btn .ic { width: 18px; height: 18px; }
.chip-btn.set { background: var(--primary-soft); color: var(--on-primary-soft); border-color: transparent; }
.chip-btn.error { border-color: var(--red); color: var(--red); background: var(--red-soft); animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
.af-err { margin-top: 6px; color: var(--red); font-size: 12px; font-weight: 600; }
.af-hint { margin-top: 6px; color: var(--muted); font-size: 12px; }
.af-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

/* ===== 詳細パネル ===== */
.panel { width: 420px; flex: none; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; animation: slideIn .2s ease-out; }
@keyframes slideIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.panel-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 8px; border-bottom: 1px solid var(--line); }
.panel-head select { max-width: 200px; }
.panel-body { flex: 1; overflow-y: auto; padding: 8px 20px 32px; }
.remote { margin: 8px 0; padding: 8px 12px; border-radius: 8px; background: var(--orange-soft); color: var(--text); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.remote .ic { color: var(--orange); width: 18px; height: 18px; }
.p-title-row { display: flex; align-items: flex-start; gap: 4px; margin: 8px 0 0 -10px; }
.p-title-row .check { margin-top: 2px; }
.et { flex: 1; min-width: 0; }
.et textarea { width: 100%; resize: none; border: 0; outline: 0; background: transparent; padding: 6px 8px; border-radius: 8px; overflow: hidden; display: block; line-height: 1.5; }
.et textarea:hover { background: var(--hover); }
.et textarea:focus { background: var(--surface2); box-shadow: inset 0 -2px 0 var(--primary); }
.et .p-title { font-size: 22px; line-height: 1.35; }
.et .p-details { font-size: 14px; color: var(--text2); min-height: 36px; }
.conflict { margin: 4px 8px; font-size: 12px; color: var(--orange); font-weight: 600; }
.field { display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line); }
.field > label { width: 150px; flex: none; display: flex; align-items: center; gap: 8px; color: var(--text2); font-size: 13px; white-space: nowrap; }
.field > label .ic { color: var(--muted); }
.req { font-size: 10px; font-weight: 700; color: var(--red); border: 1px solid var(--red); border-radius: 4px; padding: 0 4px; margin-left: 2px; }
.field-btn { flex: 1; min-width: 0; min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 8px; text-align: left; flex-wrap: wrap; }
.field-btn:hover { background: var(--hover); }
.field-btn.red { color: var(--red); font-weight: 600; }
.field-btn .muted .ic { display: inline; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.seg button { height: 32px; padding: 0 12px; font-size: 13px; color: var(--text2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--primary-soft); color: var(--on-primary-soft); font-weight: 700; }
.reason { margin: 8px 0; padding: 12px; border-radius: 12px; background: var(--surface2); }
.reason textarea, .note-input, .input, .textarea, select.input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); outline: 0; }
.reason textarea:focus, .note-input:focus, .input:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.sec-title { margin: 20px 0 8px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sec-title .ic { color: var(--muted); }
.sub-row { display: flex; align-items: center; gap: 2px; margin-left: -10px; }
.sub-row .et textarea { font-size: 14px; padding: 4px 8px; }
.sub-row.done .et textarea { text-decoration: line-through; color: var(--muted); }
.sub-row .meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
.sub-add { display: flex; align-items: center; gap: 12px; margin-left: -2px; color: var(--primary); }
.sub-add input { flex: 1; border: 0; outline: 0; background: transparent; height: 40px; }
.sub-add input::placeholder { color: var(--primary); }
.note-box { display: flex; flex-direction: column; gap: 8px; }
.note-input { resize: vertical; min-height: 64px; }
.note-actions { display: flex; align-items: center; gap: 8px; }
.note-actions .muted { font-size: 12px; flex: 1; }
.timeline { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.tl-item { display: flex; gap: 10px; }
.tl-item .tl-body { flex: 1; min-width: 0; }
.tl-item .tl-head { font-size: 12px; color: var(--muted); }
.tl-item .tl-text { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
.tl-item.latest .tl-text { font-weight: 600; }
.hist { margin-top: 16px; }
.hist summary { cursor: pointer; font-weight: 700; padding: 8px 0; display: flex; align-items: center; gap: 8px; list-style: none; }
.hist summary::-webkit-details-marker { display: none; }
.hist-item { font-size: 12px; color: var(--text2); padding: 4px 0; border-bottom: 1px dashed var(--line); }
.p-foot { margin-top: 20px; font-size: 12px; color: var(--muted); line-height: 1.8; }
.p-parent { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 4px; min-width: 0; }
.p-parent a { color: var(--primary); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== ポップアップ ===== */
.pop-scrim { position: fixed; inset: 0; z-index: 60; }
.popover { position: fixed; z-index: 61; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow2); min-width: 220px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow-y: auto; padding: 8px 0; }
.menu-item { width: 100%; min-height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-align: left; color: var(--text); }
.menu-item:hover:not(:disabled) { background: var(--hover); }
.menu-item .ic { color: var(--text2); }
.menu-item.danger { color: var(--red); }
.menu-item.danger .ic { color: var(--red); }
.menu-item .chk { width: 20px; display: flex; color: var(--primary); }
.menu-label { padding: 8px 16px 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
.menu-sep { height: 1px; background: var(--line); margin: 6px 0; }
.date-pop { padding: 12px 16px; width: 300px; display: flex; flex-direction: column; gap: 10px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; }
.quick button:hover { background: var(--hover); }
.quick button.on { background: var(--primary-soft); color: var(--on-primary-soft); border-color: transparent; font-weight: 700; }
.row { display: flex; align-items: center; gap: 8px; }
.row > label { width: 64px; flex: none; font-size: 13px; color: var(--text2); }
.custom-rep { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.custom-rep input[type=number] { width: 56px; }
.dows { display: flex; gap: 4px; }
.dows button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); font-size: 12px; }
.dows button.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.member-add { display: flex; gap: 6px; padding: 8px 12px 4px; }

/* ===== ダイアログ ===== */
.dlg-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.dialog { background: var(--surface); color: var(--text); border-radius: 28px; padding: 24px; width: 100%; max-width: 480px; max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: var(--shadow2); animation: rise .2s ease-out; }
.dialog.wide { max-width: 760px; }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } }
.dialog h2 { margin: 0 0 12px; font-size: 22px; font-weight: 500; }
.dialog p { line-height: 1.7; color: var(--text2); margin: 0 0 12px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.form-grid { display: flex; flex-direction: column; gap: 12px; }
.form-grid label.lbl { font-size: 13px; color: var(--text2); display: block; margin-bottom: 4px; font-weight: 600; }
.who-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 8px 0 16px; }
.who-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); text-align: left; }
.who-btn:hover { background: var(--hover); }
.who-btn.on { border-color: var(--primary); background: var(--primary-soft); color: var(--on-primary-soft); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 -24px 16px; padding: 0 16px; overflow-x: auto; }
.tabs button { height: 44px; padding: 0 14px; font-weight: 600; color: var(--text2); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--primary); border-bottom-color: var(--primary); }
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row .set-text { flex: 1; }
.set-row .set-text small { display: block; color: var(--muted); margin-top: 2px; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; border-radius: 16px; background: var(--surface2); border: 2px solid var(--muted); transition: .2s; cursor: pointer; }
.switch span::after { content: ''; position: absolute; width: 16px; height: 16px; left: 6px; top: 6px; border-radius: 50%; background: var(--muted); transition: .2s; }
.switch input:checked + span { background: var(--primary); border-color: var(--primary); }
.switch input:checked + span::after { left: 24px; top: 4px; width: 20px; height: 20px; background: var(--on-primary); }
.radios { display: flex; gap: 6px; flex-wrap: wrap; }
.radios button { height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line); font-size: 13px; }
.radios button.on { background: var(--primary-soft); color: var(--on-primary-soft); border-color: transparent; font-weight: 700; }
.mem-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mem-row .input { height: 36px; }
.mem-row.inactive { opacity: .55; }
.notice { padding: 10px 14px; border-radius: 12px; background: var(--surface2); font-size: 13px; line-height: 1.7; margin: 8px 0; }
.notice.warn { background: var(--orange-soft); }
.notice.bad { background: var(--red-soft); }
.log-table, .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.log-table th, .log-table td, .tbl th, .tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { color: var(--muted); font-size: 12px; font-weight: 600; }
.tbl td.num, .tbl th.num { text-align: center; }
.tbl td.num button { min-width: 32px; height: 28px; border-radius: 14px; font-weight: 700; }
.tbl td.num button:hover { background: var(--hover); }
.tbl td.num .red { color: var(--red); }
.tbl td.num .orange { color: var(--orange); }
.tbl tr.on td { background: var(--primary-soft); }
.preview-frame { width: 100%; height: 60vh; border: 1px solid var(--line); border-radius: 12px; background: #fff; }

/* ===== 進捗ボード・ページ ===== */
.page { max-width: 1040px; margin: 0 auto; padding: 8px 24px 48px; }
.page h1 { font-size: 24px; font-weight: 500; margin: 8px 0 4px; }
.page > p.muted { margin: 0 0 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; text-align: left; }
.tile:hover { box-shadow: var(--shadow); }
.tile.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.tile .tl { font-size: 13px; color: var(--text2); }
.tile .tn { font-size: 32px; font-weight: 600; margin-top: 4px; }
.tile.red .tn { color: var(--red); }
.tile.orange .tn { color: var(--orange); }
.panel-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 16px; overflow: hidden; }
.panel-card > h2 { font-size: 16px; font-weight: 600; margin: 0; padding: 14px 20px 6px; display: flex; align-items: center; gap: 8px; }
.panel-card > .tbl-wrap { overflow-x: auto; padding: 0 12px 8px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters select { height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; }

/* ===== スナックバー ===== */
.snack { position: fixed; left: 24px; bottom: 24px; z-index: 70; min-width: 288px; max-width: min(560px, calc(100vw - 32px)); background: var(--snack); color: var(--on-snack); border-radius: 4px; padding: 6px 8px 6px 16px; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow2); animation: snackIn .2s ease-out; }
.snack.error { background: #8c1d18; color: #fff; }
.snack .s-text { flex: 1; padding: 8px 0; line-height: 1.5; }
.snack .s-act { color: var(--snack-action); font-weight: 700; padding: 8px 12px; border-radius: 4px; }
.snack.error .s-act { color: #ffdad6; }
.snack .s-act:hover { background: rgba(255,255,255,.1); }
@keyframes snackIn { from { transform: translateY(16px); opacity: 0; } }

/* ===== 印刷 ===== */
.print-area { display: none; }
@media print {
  body { background: #fff; }
  .app { display: none !important; }
  .print-area { display: block; padding: 0 8px; color: #000; font-size: 12px; }
  .print-area h1 { font-size: 20px; margin: 0 0 4px; }
  .print-area table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  .print-area th, .print-area td { border-bottom: 1px solid #999; padding: 6px 4px; text-align: left; vertical-align: top; }
  .print-area .box { display: inline-block; width: 12px; height: 12px; border: 1px solid #000; border-radius: 50%; }
}

/* ===== スマホ ===== */
.only-mobile { display: none; }
@media (max-width: 900px) {
  .only-mobile { display: inline-flex; }
  .nav { position: fixed; left: 0; top: 0; bottom: 0; z-index: 40; background: var(--surface); box-shadow: var(--shadow2); transform: translateX(-105%); transition: transform .2s; padding-top: 16px; }
  .nav.open { transform: none; }
  .search { margin-left: 4px; }
  .brand span { display: none; }
  .hide-sm { display: none; }
  .who-chip { padding: 0 4px; }
  .sync .txt { display: none; }
  .board { padding: 4px 12px 16px; scroll-snap-type: x mandatory; }
  .board .card { width: calc(100vw - 32px); max-width: 420px; scroll-snap-align: center; }
  .single { padding: 4px 8px 32px; }
  .panel { position: fixed; inset: 0; width: auto; z-index: 45; border-left: 0; animation: slideUp .2s ease-out; }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } }
  .page { padding: 8px 12px 40px; }
  .snack { left: 16px; bottom: 16px; }
  .dialog { border-radius: 20px; padding: 20px; }
  .field > label { width: 128px; gap: 6px; }
  .topbar { gap: 4px; padding: 0 8px 0 4px; }
  .search { height: 42px; padding-left: 12px; }
}
</style>

  <script>
/*
 * 本部タスク — 画面の動き
 * Google ToDo リストと同じ操作感 ＋ 誰が・いつまでに・何を ＋ 進捗管理
 *
 * 最新情報を反映するしくみ（同じアカウントを何人かで同時に使うため）
 * - 押した操作はすぐ画面に反映し、裏で順番にサーバーへ送る（送信待ちの列）
 * - 数秒ごとに「前回より新しい変更」だけを受け取り、画面に重ねる
 * - 他の人が変えたタスクは、オレンジ色に一瞬光らせて知らせる
 */
(function () {
  'use strict';
  const { html, render, useState, useEffect, useRef, useLayoutEffect } = window.htmPreact;
  const ICONS = window.ICONS || {};
  const root = document.getElementById('app');
  const INITIAL_TASK = (root.dataset.task || '').trim();

  /* ================= 端末ごとの保存（この端末だけの設定） ================= */
  const local = {
    get(k, d) { try { const v = localStorage.getItem('nrbtask.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('nrbtask.' + k, JSON.stringify(v)); } catch (e) { /* 保存できない環境では覚えない */ } },
  };
  const DEFAULT_PREFS = { addToTop: true, sound: false, motion: true, theme: 'auto' };

  /* ================= 状態 ================= */
  const S = {
    ready: false, bootError: '', rev: 0, online: true, lastSync: 0,
    lists: {}, tasks: {}, members: {}, config: null, appUrl: '',
    queue: [],
    view: { type: 'all' }, selected: null, search: '',
    operator: local.get('operator', ''),
    prefs: Object.assign({}, DEFAULT_PREFS, local.get('prefs', {})),
    hidden: local.get('hidden', {}),
    navListsOpen: true,
    completing: {}, flash: {}, remote: null,
    expandedDone: {}, drag: null, drop: null,
    pop: null, dialog: null, snack: null, drawer: false, printId: null,
    trash: null, boardFilter: { assignee: '', listId: '', bucket: '' },
  };
  let CUR = null;
  let renderQueued = false;
  function update(fn) {
    if (fn) fn(S);
    if (!renderQueued) {
      renderQueued = true;
      setTimeout(() => { renderQueued = false; draw(); }, 0);
    }
  }
  function draw() { render(html`<${App} />`, root); }

  /* ================= 小さな道具 ================= */
  const DOW = ['日', '月', '火', '水', '木', '金', '土'];
  const p2 = n => (n < 10 ? '0' : '') + n;
  const ymd = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  const todayYmd = () => ymd(new Date());
  const parseYmd = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
  const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const nowIso = () => new Date().toISOString();
  const byNum = k => (a, b) => (a[k] || 0) - (b[k] || 0);

  function dueAt(t) {
    if (!t || !t.due) return Infinity;
    const d = parseYmd(t.due);
    const tm = (t.dueTime || '23:59').split(':').map(Number);
    d.setHours(tm[0], tm[1], 59, 0);
    return d.getTime();
  }
  function isOverdue(t) { return t.status !== 'done' && !!t.due && dueAt(t) < Date.now(); }
  function mdLabel(s) {
    if (!s) return '';
    const d = parseYmd(s);
    const base = (d.getMonth() + 1) + '月' + d.getDate() + '日(' + DOW[d.getDay()] + ')';
    return d.getFullYear() === new Date().getFullYear() ? base : d.getFullYear() + '年' + base;
  }
  function dayWord(s) {
    const t = todayYmd();
    if (s === t) return '今日';
    if (s === addDays(t, 1)) return '明日';
    if (s === addDays(t, -1)) return '昨日';
    return mdLabel(s);
  }
  function dueLabel(t) { return t.due ? dayWord(t.due) + (t.dueTime ? ' ' + t.dueTime : '') : ''; }
  function fmtAt(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const same = ymd(d) === todayYmd();
    return (same ? '今日 ' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + d.getHours() + ':' + p2(d.getMinutes());
  }
  function fmtRel(iso) {
    if (!iso) return '';
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'たった今';
    if (s < 3600) return Math.floor(s / 60) + '分前';
    if (s < 86400) return Math.floor(s / 3600) + '時間前';
    if (s < 86400 * 7) return Math.floor(s / 86400) + '日前';
    return fmtAt(iso);
  }
  const REPEAT_LABEL = { '': '繰り返さない', daily: '毎日', weekdays: '平日（月〜金）', weekly: '毎週', monthly: '毎月', yearly: '毎年' };
  function repeatLabel(r) {
    if (!r) return '';
    if (REPEAT_LABEL[r]) return REPEAT_LABEL[r];
    const p = r.split(':');
    const unit = { day: '日', week: '週', month: 'か月', year: '年' }[p[2]];
    const days = p[3] ? '（' + p[3].split(',').map(n => DOW[n]).join('・') + '）' : '';
    return p[1] + unit + 'ごと' + days;
  }
  const STATUS_LABEL = { todo: '未着手', doing: '進行中', done: '完了' };

  function memberName(id) { const m = CUR && CUR.members[id]; return m ? m.name : ''; }
  function activeMembers() { return Object.values(CUR.members).filter(m => m.active).sort(byNum('sortOrder')); }
  function listName(id) { const l = CUR && CUR.lists[id]; return l ? l.name : ''; }
  const COLORS = ['#1a73e8', '#d93025', '#188038', '#e37400', '#9334e6', '#007b83', '#c5221f', '#5f6368', '#b06000', '#1967d2', '#a50e0e', '#137333'];
  function colorOf(id) { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }

  function Icon({ n, cls }) {
    return html`<svg class=${'ic' + (cls ? ' ' + cls : '')} viewBox="0 0 24 24" aria-hidden="true" dangerouslySetInnerHTML=${{ __html: ICONS[n] || '' }}></svg>`;
  }
  function Avatar({ id, size }) {
    const s = size || 28;
    const name = memberName(id);
    if (!name) return html`<span class="avatar none" style=${{ width: s + 'px', height: s + 'px', fontSize: s * 0.5 + 'px' }}><${Icon} n="person" /></span>`;
    return html`<span class="avatar" title=${name} style=${{ width: s + 'px', height: s + 'px', fontSize: s * 0.46 + 'px', background: colorOf(id) }}>${name.slice(0, 1)}</span>`;
  }
  function Logo() {
    return html`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 3.5l6.5 6h9l6.5-6V18a11 11 0 0 1-11 11h0A11 11 0 0 1 5 18z" fill="#0b57d0"/><path d="M10.5 18l4 4 7.5-8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  let audio = null;
  function ding() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = audio.currentTime;
      [[880, 0], [1318.5, 0.09]].forEach(([f, d]) => {
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0 + d);
        g.gain.exponentialRampToValueAtTime(0.16, t0 + d + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.28);
        o.connect(g);
        g.connect(audio.destination);
        o.start(t0 + d);
        o.stop(t0 + d + 0.3);
      });
    } catch (e) { /* 音が出せない環境 */ }
  }

  /* ================= サーバーとのやりとり ================= */
  function call(fn, payload) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(s => { try { resolve(s ? JSON.parse(s) : null); } catch (e) { reject(e); } })
        .withFailureHandler(err => reject(err))
        .rpc(fn, Object.assign({ actor: S.operator || '' }, payload || {}));
    });
  }
  const errText = e => String((e && e.message) || e || 'エラーが起きました').replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '');
  const retryable = e => /BUSY|Network|HTTP|timed? ?out|too many|Service|Failed to fetch|サーバー|一時的|Timeout|Unavailable/i.test(errText(e));

  function snack(text, opts) {
    const id = uid();
    update(s => { s.snack = Object.assign({ id: id, text: text }, opts || {}); });
    setTimeout(() => update(s => { if (s.snack && s.snack.id === id) s.snack = null; }), (opts && opts.ms) || 5000);
  }

  function applyEntities(map, arr, keepDeleted) {
    (arr || []).forEach(e => {
      const cur = map[e.id];
      if (cur && (cur.rev || 0) > (e.rev || 0)) return;
      if (e.deletedAt && !keepDeleted) delete map[e.id];
      else map[e.id] = e;
    });
  }
  function applyResult(res) {
    if (!res) return;
    applyEntities(S.lists, res.lists);
    applyEntities(S.tasks, res.tasks);
    applyEntities(S.members, res.members, true);
    if (res.config) S.config = res.config;
  }
  function replaceAll(res) {
    S.lists = {}; S.tasks = {}; S.members = {};
    applyResult(res);
  }

  /* 送信待ちの列（押した順にサーバーへ送る） */
  function enqueue(fn, payload, after) {
    S.queue.push({ fn: fn, payload: payload, at: nowIso(), tries: 0, after: after });
    update();
    pump();
  }
  let pumping = false;
  async function pump() {
    if (pumping) return;
    pumping = true;
    while (S.queue.length) {
      const op = S.queue[0];
      if (op.fn === 'updateTask') {
        const known = S.tasks[op.payload.id];
        if (op.payload.baseVersion === undefined) op.payload.baseVersion = known ? known.version : 0;
      }
      try {
        const res = await call(op.fn, op.payload);
        applyResult(res);
        S.queue.shift();
        S.online = true;
        if (res && res.mergedBy) {
          const tid = op.payload.id;
          snack(((S.members[res.mergedBy] || {}).name || 'ほかの人') + 'さんの変更と合わせて保存しました');
          if (S.selected === tid) S.remote = { id: tid, by: res.mergedBy, at: Date.now() };
        }
        if (op.after) { try { op.after(res); } catch (e) { /* 後処理の失敗は無視 */ } }
      } catch (err) {
        if (retryable(err) && op.tries < 8) {
          op.tries++;
          S.online = false;
          update();
          await new Promise(r => setTimeout(r, Math.min(20000, 800 * Math.pow(2, op.tries))));
          continue;
        }
        S.queue.shift();
        snack(errText(err).replace(/^BUSY:\s*/, ''), { kind: 'error', ms: 7000 });
        doSync();
      }
      update();
    }
    pumping = false;
    update();
  }

  /* 数秒ごとに最新を取りに行く */
  let syncing = false;
  let syncTimer = null;
  async function doSync() {
    if (syncing || !S.ready) return;
    syncing = true;
    try {
      const res = await call('sync', { rev: S.rev });
      if (!res.unchanged) {
        if (res.full) replaceAll(res);
        else { noticeRemote(res); applyResult(res); }
      }
      S.rev = res.rev;
      S.online = true;
      S.lastSync = Date.now();
      checkOperator();
    } catch (e) {
      S.online = false;
    }
    syncing = false;
    update();
    scheduleSync();
  }
  // 見ているときは4秒ごと、しばらく触っていないときは15秒ごと、裏にあるときは60秒ごと
  let lastTouch = Date.now();
  ['pointerdown', 'keydown', 'wheel'].forEach(ev => document.addEventListener(ev, () => {
    const idle = Date.now() - lastTouch > 5 * 60000;
    lastTouch = Date.now();
    if (idle) doSync();
  }, { passive: true }));
  function scheduleSync() {
    clearTimeout(syncTimer);
    const ms = document.visibilityState !== 'visible' ? 60000 : Date.now() - lastTouch > 5 * 60000 ? 15000 : 4000;
    syncTimer = setTimeout(doSync, ms);
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') doSync(); });
  window.addEventListener('focus', () => doSync());
  window.addEventListener('online', () => { doSync(); pump(); });

  /* 他の人の変更を知らせる */
  function noticeRemote(res) {
    const me = S.operator;
    (res.tasks || []).forEach(t => {
      const by = t.deletedAt ? t.deletedBy : t.updatedBy;
      if (!by || by === me) return;
      const old = S.tasks[t.id];
      if (old && old.version === t.version) return;
      S.flash[t.id] = Date.now();
      setTimeout(() => update(s => { delete s.flash[t.id]; }), 2600);
      if (S.selected === t.id) S.remote = { id: t.id, by: by, at: Date.now(), deleted: !!t.deletedAt };
      if (!t.deletedAt && !t.parentId && t.assignee === me && t.status !== 'done' && (!old || old.assignee !== me)) {
        const who = (S.members[by] || {}).name || 'ほかの人';
        snack(who + 'さんから担当タスクが届きました：「' + t.title + '」', { action: { label: '開く', fn: () => openTask(t.id) }, ms: 8000 });
      }
    });
  }

  function checkOperator() {
    if (S.queue.some(op => op.fn === 'saveMember')) return;
    const m = S.members[S.operator];
    if (!S.operator || !m || !m.active) {
      if (!S.dialog || S.dialog.type !== 'who') S.dialog = { type: 'who', required: true };
    }
  }

  /* ================= 画面に出す前の組み立て（送信待ちも重ねる） ================= */
  function derive() {
    const tasks = Object.assign({}, S.tasks);
    const lists = Object.assign({}, S.lists);
    const members = Object.assign({}, S.members);
    S.queue.forEach(op => overlay(op, tasks, lists, members));
    const listArr = Object.values(lists).filter(l => !l.deletedAt).sort(byNum('sortOrder'));
    const children = {};
    const byList = {};
    Object.values(tasks).forEach(t => {
      if (t.deletedAt || !lists[t.listId] || lists[t.listId].deletedAt) return;
      if (t.parentId) (children[t.parentId] = children[t.parentId] || []).push(t);
      else (byList[t.listId] = byList[t.listId] || []).push(t);
    });
    Object.keys(children).forEach(k => children[k].sort((a, b) => (a.sortOrder - b.sortOrder) || (a.createdAt < b.createdAt ? -1 : 1)));
    return { tasks: tasks, lists: lists, members: members, listArr: listArr, children: children, byList: byList };
  }

  function overlay(op, tasks, lists, members) {
    const p = op.payload;
    const kids = id => Object.values(tasks).filter(t => t.parentId === id);
    switch (op.fn) {
      case 'createTask':
        tasks[p.task.id] = Object.assign({
          status: 'todo', version: 0, rev: 0, starred: false, details: '', dueTime: '', repeat: '', noteText: '',
          createdAt: op.at, createdBy: S.operator, updatedAt: op.at, updatedBy: S.operator, parentId: '',
        }, p.task, { _pending: true });
        break;
      case 'updateTask': {
        const cur = tasks[p.id];
        if (!cur) break;
        const t = Object.assign({}, cur, p.patch);
        if ('status' in p.patch) {
          if (p.patch.status === 'done' && cur.status !== 'done') {
            t.completedAt = op.at;
            kids(p.id).forEach(c => { tasks[c.id] = Object.assign({}, c, { status: 'done', completedAt: op.at }); });
          }
          if (p.patch.status !== 'done') t.completedAt = '';
        }
        if ('starred' in p.patch) t.starredAt = p.patch.starred ? (cur.starredAt || op.at) : '';
        if ('listId' in p.patch && !cur.parentId) kids(p.id).forEach(c => { tasks[c.id] = Object.assign({}, c, { listId: p.patch.listId }); });
        tasks[p.id] = t;
        break;
      }
      case 'deleteTask':
        delete tasks[p.id];
        kids(p.id).forEach(c => delete tasks[c.id]);
        break;
      case 'clearCompleted': {
        const doneTop = {};
        Object.values(tasks).forEach(t => { if (t.listId === p.listId && !t.parentId && t.status === 'done') doneTop[t.id] = 1; });
        Object.values(tasks).forEach(t => { if (t.listId === p.listId && (t.status === 'done' || doneTop[t.parentId])) delete tasks[t.id]; });
        break;
      }
      case 'addNote': {
        const cur = tasks[p.taskId];
        if (cur) tasks[p.taskId] = Object.assign({}, cur, { noteText: p.text, noteAt: op.at, noteBy: S.operator, status: cur.status === 'todo' ? 'doing' : cur.status, _notePending: true });
        break;
      }
      case 'createList':
        lists[p.id] = { id: p.id, name: p.name, sortMode: 'my', sortOrder: 1e9, rev: 0, _pending: true };
        break;
      case 'updateList':
        if (lists[p.id]) lists[p.id] = Object.assign({}, lists[p.id], p.patch);
        break;
      case 'deleteList':
        delete lists[p.id];
        break;
      case 'reorderLists':
        p.ids.forEach((id, i) => { if (lists[id]) lists[id] = Object.assign({}, lists[id], { sortOrder: i + 1 }); });
        break;
      case 'saveMember':
        members[p.member.id] = Object.assign({ sortOrder: 1e9, rev: 0 }, members[p.member.id] || {}, p.member, { _pending: true });
        break;
    }
  }

  /* ================= 操作 ================= */
  const act = {
    createTask(task) { enqueue('createTask', { task: task }); },
    updateTask(id, patch) { enqueue('updateTask', { id: id, patch: patch }); },
    deleteTask(t) {
      enqueue('deleteTask', { id: t.id });
      if (S.selected === t.id) S.selected = null;
      snack('タスクを削除しました', { action: { label: '元に戻す', fn: () => enqueue('restoreTask', { id: t.id }) } });
    },
    addNote(taskId, text) { enqueue('addNote', { taskId: taskId, text: text, id: uid() }); },
    createList(name, then) { const id = uid(); enqueue('createList', { id: id, name: name }); if (then) then(id); },
    updateList(id, patch) { enqueue('updateList', { id: id, patch: patch }); },
    saveMember(member) { enqueue('saveMember', { member: member }); },
  };

  function complete(t) {
    if (S.completing[t.id] || t.status === 'done') return;
    const prev = t.status;
    update(s => { s.completing[t.id] = true; });
    if (S.prefs.sound) ding();
    setTimeout(() => {
      act.updateTask(t.id, { status: 'done' });
      update(s => { delete s.completing[t.id]; });
      snack('タスクを完了しました', { action: { label: '元に戻す', fn: () => act.updateTask(t.id, { status: prev }) } });
    }, S.prefs.motion ? 650 : 0);
  }
  function uncomplete(t) { act.updateTask(t.id, { status: t.noteText ? 'doing' : 'todo' }); }
  function toggleStar(t) { act.updateTask(t.id, { starred: !t.starred }); }
  function openTask(id) {
    const t = CUR && CUR.tasks[id];
    update(s => { s.selected = id; s.remote = null; s.drawer = false; if (t && s.view.type === 'list' && s.view.id !== t.listId && !t.parentId) s.view = { type: 'list', id: t.listId }; });
  }
  function go(view) { update(s => { s.view = view; s.search = ''; s.drawer = false; if (view.type === 'trash') s.trash = null; }); }
  function setPref(k, v) { update(s => { s.prefs[k] = v; local.set('prefs', s.prefs); }); }
  function setOperator(id) { update(s => { s.operator = id; local.set('operator', id); s.dialog = null; }); }
  function newSortOrder(listId) {
    const open = (CUR.byList[listId] || []).filter(t => t.status !== 'done').map(t => t.sortOrder || 0);
    if (!open.length) return 0;
    return S.prefs.addToTop ? Math.min.apply(null, open) - 1024 : Math.max.apply(null, open) + 1024;
  }
  function openPop(e, type, ctx) {
    const r = e.currentTarget.getBoundingClientRect();
    update(s => { s.pop = { id: uid(), type: type, rect: { left: r.left, top: r.top, bottom: r.bottom, right: r.right }, ctx: ctx || {} }; });
  }
  const closePop = () => update(s => { s.pop = null; });
  function confirmDlg(title, body, okLabel, onOk, danger) { update(s => { s.dialog = { type: 'confirm', title: title, body: body, ok: okLabel, onOk: onOk, danger: danger }; }); }
  function printList(id) {
    update(s => { s.printId = id; s.pop = null; });
    setTimeout(() => { window.print(); setTimeout(() => update(s => { s.printId = null; }), 500); }, 300);
  }

  /* ================= 並べ替え・まとめ ================= */
  function sortMy(arr) { return arr.slice().sort((a, b) => (a.sortOrder - b.sortOrder) || (a.createdAt < b.createdAt ? 1 : -1)); }
  function dateBucket(t) {
    if (isOverdue(t)) return { key: '0', label: '期限切れ', red: true };
    const td = todayYmd();
    if (t.due === td) return { key: '1', label: '今日' };
    if (t.due === addDays(td, 1)) return { key: '2', label: '明日' };
    return { key: '3' + t.due, label: mdLabel(t.due) };
  }
  function groupsFor(list, open) {
    const mode = list.sortMode || 'my';
    if (mode === 'date') return groupBy(open.slice().sort((a, b) => dueAt(a) - dueAt(b) || a.sortOrder - b.sortOrder), dateBucket);
    if (mode === 'assignee') {
      const sorted = open.slice().sort((a, b) => memberName(a.assignee).localeCompare(memberName(b.assignee), 'ja') || dueAt(a) - dueAt(b));
      return groupBy(sorted, t => ({ key: t.assignee, label: memberName(t.assignee) || '（担当者なし）' }));
    }
    if (mode === 'starred') {
      const st = open.filter(t => t.starred).sort((a, b) => (a.starredAt < b.starredAt ? 1 : -1));
      return [{ key: 'all', label: '', items: st.concat(sortMy(open.filter(t => !t.starred))) }];
    }
    if (mode === 'title') return [{ key: 'all', label: '', items: open.slice().sort((a, b) => a.title.localeCompare(b.title, 'ja')) }];
    return [{ key: 'all', label: '', items: sortMy(open) }];
  }
  function groupBy(arr, fn) {
    const out = [];
    const idx = {};
    arr.forEach(t => {
      const g = fn(t);
      if (!(g.key in idx)) { idx[g.key] = out.length; out.push({ key: g.key, label: g.label, red: g.red, items: [] }); }
      out[idx[g.key]].items.push(t);
    });
    return out.sort((a, b) => (a.key < b.key ? -1 : 1));
  }
  function openOf(listId) { return (CUR.byList[listId] || []).filter(t => t.status !== 'done' || S.completing[t.id]); }

  /** 進捗ボードとメールで同じ考え方 */
  function collect() {
    const cfg = S.config || { soonDays: 3, staleDays: 3 };
    const td = todayYmd();
    const soon = addDays(td, cfg.soonDays);
    const staleMs = Date.now() - cfg.staleDays * 86400000;
    const top = [];
    CUR.listArr.forEach(l => (CUR.byList[l.id] || []).forEach(t => top.push(t)));
    const open = top.filter(t => t.status !== 'done');
    const b = { overdue: [], today: [], soon: [], stale: [] };
    open.forEach(t => {
      if (isOverdue(t)) b.overdue.push(t);
      else if (t.due === td) b.today.push(t);
      else if (t.due && t.due <= soon) b.soon.push(t);
      const last = Math.max(new Date(t.updatedAt || 0).getTime(), new Date(t.noteAt || 0).getTime(), new Date(t.createdAt || 0).getTime());
      if (last < staleMs) b.stale.push(t);
    });
    Object.keys(b).forEach(k => b[k].sort((x, y) => dueAt(x) - dueAt(y)));
    const d = new Date();
    const weekStart = addDays(td, -((d.getDay() + 6) % 7));
    const rows = {};
    const row = id => rows[id] || (rows[id] = { id: id, overdue: 0, today: 0, soon: 0, doing: 0, todo: 0, doneWeek: 0 });
    b.overdue.forEach(t => row(t.assignee).overdue++);
    b.today.forEach(t => row(t.assignee).today++);
    b.soon.forEach(t => row(t.assignee).soon++);
    open.forEach(t => row(t.assignee)[t.status === 'doing' ? 'doing' : 'todo']++);
    top.filter(t => t.status === 'done' && t.completedAt && ymd(new Date(t.completedAt)) >= weekStart).forEach(t => row(t.assignee).doneWeek++);
    const byAssignee = Object.values(rows).sort((x, y) => ((CUR.members[x.id] || {}).sortOrder || 9999) - ((CUR.members[y.id] || {}).sortOrder || 9999));
    return { cfg: cfg, top: top, open: open, b: b, byAssignee: byAssignee };
  }

  /* ================= 画面 ================= */
  function App() {
    CUR = derive();
    useGlobalKeys();
    if (!S.ready) {
      return html`<div class="boot">${S.bootError
        ? html`<div class="boot-error"><b>読み込めませんでした</b><br/>${S.bootError}<br/><br/><button class="btn primary" onClick=${() => location.reload()}>もう一度読み込む</button></div>`
        : html`<div class="boot-spin"></div><div>読み込み中…</div>`}</div>`;
    }
    return html`
      <div class=${'app' + (S.prefs.motion ? '' : ' no-motion')} data-theme=${S.prefs.theme}>
        <${TopBar} />
        <div class="body">
          <${Nav} />
          <main class="main">${mainView()}</main>
          ${S.selected && html`<${DetailPanel} key=${S.selected} id=${S.selected} />`}
        </div>
        ${S.drawer && html`<div class="scrim" onClick=${() => update(s => { s.drawer = false; })}></div>`}
        <${PopLayer} />
        <${DialogLayer} />
        <${Snack} />
      </div>
      <${PrintArea} />`;
  }

  function useGlobalKeys() {
    useEffect(() => {
      const h = e => {
        if (e.key !== 'Escape') return;
        if (S.pop) return closePop();
        if (S.dialog && !S.dialog.required) return update(s => { s.dialog = null; });
        if (S.selected && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) update(s => { s.selected = null; });
      };
      document.addEventListener('keydown', h);
      return () => document.removeEventListener('keydown', h);
    }, []);
  }

  function mainView() {
    if (S.search.trim()) return html`<${SearchView} />`;
    switch (S.view.type) {
      case 'list': {
        const l = CUR.lists[S.view.id];
        if (!l) return html`<${Board} />`;
        return html`<div class="single"><${ListCard} key=${l.id} list=${l} wide /></div>`;
      }
      case 'starred': return html`<${StarredView} />`;
      case 'mine': return html`<${MineView} />`;
      case 'progress': return html`<${ProgressView} />`;
      case 'trash': return html`<${TrashView} />`;
      default: return html`<${Board} />`;
    }
  }

  function TopBar() {
    const saving = S.queue.length > 0;
    const syncCls = !S.online ? 'offline' : saving ? 'saving' : '';
    const syncText = !S.online ? 'オフライン（再接続中）' : saving ? '保存中…' : '最新の状態';
    const syncTitle = S.lastSync ? '最後に確認: ' + new Date(S.lastSync).toLocaleTimeString('ja-JP') : '';
    return html`<header class="topbar">
      <button class="icon-btn only-mobile" aria-label="メニュー" onClick=${() => update(s => { s.drawer = !s.drawer; })}><${Icon} n="menu" /></button>
      <div class="brand" onClick=${() => go({ type: 'all' })}><${Logo} /><span>本部タスク</span></div>
      <label class="search"><${Icon} n="search" />
        <input placeholder="タスクを検索" value=${S.search} onInput=${e => update(s => { s.search = e.target.value; })} />
        ${S.search && html`<button class="icon-btn sm" aria-label="検索を消す" onClick=${() => update(s => { s.search = ''; })}><${Icon} n="close" /></button>`}
      </label>
      <div class=${'sync ' + syncCls} title=${syncTitle}><${Icon} n=${!S.online ? 'cloud_off' : saving ? 'sync' : 'cloud_done'} /><span class="txt">${syncText}</span></div>
      <button class="who-chip" title="操作している人（タップで切り替え）" onClick=${() => update(s => { s.dialog = { type: 'who' }; })}>
        <${Avatar} id=${S.operator} size=${30} /><span class="hide-sm">${memberName(S.operator) || '操作する人'}</span>
      </button>
      <button class="icon-btn" aria-label="設定" onClick=${() => update(s => { s.dialog = { type: 'settings', tab: 'display' }; })}><${Icon} n="settings" /></button>
    </header>`;
  }

  function Nav() {
    const st = collect();
    const mine = st.open.filter(t => t.assignee === S.operator).length;
    const item = (icon, label, view, count, red) => html`
      <button class=${'nav-item' + (S.view.type === view.type && !S.search ? ' active' : '')} onClick=${() => go(view)}>
        <${Icon} n=${icon} /><span class="label">${label}</span>${count ? html`<span class=${'count' + (red ? ' red' : '')}>${count}</span>` : ''}
      </button>`;
    const dragList = useRef(null);
    return html`<nav class=${'nav' + (S.drawer ? ' open' : '')}>
      <button class="create-btn" onClick=${() => update(s => { s.dialog = { type: 'create' }; s.drawer = false; })}><${Icon} n="add" />作成</button>
      ${item('task_alt', 'すべてのタスク', { type: 'all' })}
      ${item('star', 'スター付き', { type: 'starred' })}
      ${item('person', '自分の担当', { type: 'mine' }, mine)}
      ${item('dashboard', '進捗ボード', { type: 'progress' }, st.b.overdue.length, true)}
      <div class="nav-sep"></div>
      <button class=${'nav-head' + (S.navListsOpen ? '' : ' closed')} onClick=${() => update(s => { s.navListsOpen = !s.navListsOpen; })}>
        <span class="grow" style="text-align:left">リスト</span><${Icon} n="expand_more" />
      </button>
      ${S.navListsOpen && CUR.listArr.map(l => html`
        <div key=${l.id} class=${'nav-list' + (S.view.type === 'list' && S.view.id === l.id && !S.search ? ' active' : '') + (S.drop && S.drop.navBefore === l.id ? ' drop' : '')}
          draggable="true"
          onDragStart=${e => { dragList.current = l.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'list:' + l.id); }}
          onDragOver=${e => { if (!dragList.current) return; e.preventDefault(); if (!S.drop || S.drop.navBefore !== l.id) update(s => { s.drop = { navBefore: l.id }; }); }}
          onDragEnd=${() => { dragList.current = null; update(s => { s.drop = null; }); }}
          onDrop=${e => {
            e.preventDefault();
            const from = dragList.current;
            dragList.current = null;
            S.drop = null;
            if (!from || from === l.id) return update();
            const ids = CUR.listArr.map(x => x.id).filter(x => x !== from);
            ids.splice(ids.indexOf(l.id), 0, from);
            enqueue('reorderLists', { ids: ids });
          }}>
          <label class="cb" title="「すべてのタスク」に表示する"><input type="checkbox" checked=${!S.hidden[l.id]} onChange=${() => update(s => { s.hidden[l.id] = !s.hidden[l.id]; if (!s.hidden[l.id]) delete s.hidden[l.id]; local.set('hidden', s.hidden); })} /><span class="box"></span></label>
          <button class="nav-list-name" onClick=${() => go({ type: 'list', id: l.id })}>${l.name}</button>
          <span class="count">${openOf(l.id).length || ''}</span>
        </div>`)}
      ${S.navListsOpen && html`<button class="nav-item" onClick=${() => update(s => { s.dialog = { type: 'listName', mode: 'new' }; s.drawer = false; })}><${Icon} n="add" /><span class="label">新しいリストを作成</span></button>`}
      <div class="nav-sep"></div>
      ${item('delete', 'ごみ箱', { type: 'trash' })}
    </nav>`;
  }

  /* ---------- すべてのタスク（リストを横に並べる） ---------- */
  function Board() {
    const shown = CUR.listArr.filter(l => !S.hidden[l.id]);
    return html`<div class="board">
      ${shown.map(l => html`<${ListCard} key=${l.id} list=${l} />`)}
      ${!shown.length && html`<div class="empty" style="margin:auto">左の「リスト」で、表示するリストにチェックを入れてください</div>`}
      <button class="new-list-card" onClick=${() => update(s => { s.dialog = { type: 'listName', mode: 'new' }; })}><${Icon} n="add" />新しいリストを作成</button>
    </div>`;
  }

  function ListCard({ list, wide }) {
    const [adding, setAdding] = useState(false);
    const all = CUR.byList[list.id] || [];
    const open = all.filter(t => t.status !== 'done' || S.completing[t.id]);
    const openIds = {};
    open.forEach(t => { openIds[t.id] = 1; });
    const done = all.filter(t => t.status === 'done' && !S.completing[t.id])
      .concat(Object.values(CUR.children).flat().filter(c => openIds[c.parentId] && c.status === 'done' && !S.completing[c.id] && c.listId === list.id))
      .sort((a, b) => (a.completedAt < b.completedAt ? 1 : -1));
    const expanded = !!S.expandedDone[list.id];
    const mode = list.sortMode || 'my';
    const groups = groupsFor(list, open);
    const canDrag = mode === 'my';
    const dropEnd = S.drop && S.drop.listId === list.id && !S.drop.before;

    const onDragOver = e => {
      if (!S.drag) return;
      e.preventDefault();
      const row = e.target.closest && e.target.closest('.task:not(.sub)');
      let before = null;
      if (row && canDrag) {
        const r = row.getBoundingClientRect();
        const id = row.getAttribute('data-id');
        if (e.clientY < r.top + r.height / 2) before = id;
        else {
          const items = groups[0] ? groups[0].items : [];
          const i = items.findIndex(t => t.id === id);
          before = items[i + 1] ? items[i + 1].id : null;
        }
      }
      if (!S.drop || S.drop.listId !== list.id || S.drop.before !== before) update(s => { s.drop = { listId: list.id, before: before }; });
    };
    const onDrop = e => {
      e.preventDefault();
      const drag = S.drag;
      const drop = S.drop;
      update(s => { s.drag = null; s.drop = null; });
      if (!drag || !drop) return;
      const t = CUR.tasks[drag];
      if (!t) return;
      const items = sortMy(openOf(list.id).filter(x => x.id !== drag && x.status !== 'done'));
      let idx = drop.before ? items.findIndex(x => x.id === drop.before) : items.length;
      if (idx < 0) idx = items.length;
      if (!canDrag) idx = S.prefs.addToTop ? 0 : items.length;
      const prev = items[idx - 1];
      const next = items[idx];
      const order = prev && next ? (prev.sortOrder + next.sortOrder) / 2 : prev ? prev.sortOrder + 1024 : next ? next.sortOrder - 1024 : 0;
      const patch = { sortOrder: order };
      if (t.listId !== list.id) patch.listId = list.id;
      if (t.listId === list.id && t.sortOrder === order) return;
      act.updateTask(t.id, patch);
      if (patch.listId) snack('「' + list.name + '」に移動しました');
    };

    return html`<section class=${'card' + (wide ? ' wide' : '') + (S.drop && S.drop.listId === list.id ? ' drop-card' : '')} onDragOver=${onDragOver} onDrop=${onDrop}>
      <header class="card-head">
        <h2 class="card-title" title=${list.name}>${list.name}</h2>
        <button class="icon-btn" aria-label="リストのメニュー" onClick=${e => openPop(e, 'listMenu', { listId: list.id })}><${Icon} n="more_vert" /></button>
      </header>
      ${mode !== 'my' && html`<div class="card-sub">並べ替え: ${{ date: '日付', starred: 'スター付き（最近）', title: 'タイトル', assignee: '担当者' }[mode]}</div>`}
      <div class="card-scroll">
        ${adding
          ? html`<${AddForm} listId=${list.id} onClose=${() => setAdding(false)} />`
          : html`<button class="add-task" onClick=${() => setAdding(true)}><${Icon} n="add" />タスクを追加</button>`}
        <div class=${'task-list' + (dropEnd ? ' drop-end' : '')}>
          ${groups.map(g => html`
            ${g.label && html`<div class=${'group-head' + (g.red ? ' red' : '')}>${g.label}</div>`}
            ${g.items.map(t => html`<${TaskRow} key=${t.id} task=${t} draggable=${true} />`)}`)}
        </div>
        ${!open.length && !adding && html`<${Empty} allDone=${done.length > 0} />`}
        ${done.length > 0 && html`<div class="done-sec">
          <button class="done-head" onClick=${() => update(s => { s.expandedDone[list.id] = !expanded; })}>
            <${Icon} n=${expanded ? 'expand_more' : 'chevron_right'} />完了（${done.length}件）
          </button>
          ${expanded && done.map(t => html`<${TaskRow} key=${t.id} task=${t} done sub=${!!t.parentId} />`)}
        </div>`}
      </div>
    </section>`;
  }

  function Empty({ allDone }) {
    return html`<div class="empty">
      <svg viewBox="0 0 160 120" aria-hidden="true">
        <circle cx="80" cy="62" r="40" fill="var(--primary-soft)" />
        <path d="M62 63l12 12 25-27" fill="none" stroke="var(--primary)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M28 30l4 9 9 4-9 4-4 9-4-9-9-4 9-4zM132 20l3 6 6 3-6 3-3 6-3-6-6-3 6-3zM134 84l2.5 5 5 2.5-5 2.5-2.5 5-2.5-5-5-2.5 5-2.5z" fill="var(--orange)" opacity=".8" />
      </svg>
      ${allDone
        ? html`<div class="em-title">すべてのタスクを完了しました</div><div>おつかれさまでした！</div>`
        : html`<div class="em-title">タスクはまだありません</div><div>「タスクを追加」から登録できます</div>`}
    </div>`;
  }

  function TaskRow({ task: t, done, sub, showList, draggable }) {
    const completing = !!S.completing[t.id];
    const overdue = !done && isOverdue(t);
    const isToday = !done && !overdue && t.due === todayYmd();
    const allKids = !t.parentId ? (CUR.children[t.id] || []) : [];
    const openKids = !done ? allKids.filter(c => c.status !== 'done' || S.completing[c.id]) : [];
    const doneKids = allKids.filter(c => c.status === 'done').length;
    const parent = t.parentId ? CUR.tasks[t.parentId] : null;
    const showWho = t.assignee && (!parent || parent.assignee !== t.assignee);
    const cls = ['task', done && 'is-done', completing && 'completing', (sub || t.parentId) && 'sub', S.selected === t.id && 'selected',
      S.flash[t.id] && 'flash', t._pending && 'pending', S.drop && S.drop.before === t.id && 'drop-before', S.drag === t.id && 'dragging'].filter(Boolean).join(' ');
    const canDrag = draggable && !t.parentId && !done;
    return html`<div>
      <div class=${cls} data-id=${t.id} draggable=${canDrag ? 'true' : 'false'}
        onDragStart=${canDrag ? e => { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', t.id); setTimeout(() => update(s => { s.drag = t.id; }), 0); } : undefined}
        onDragEnd=${canDrag ? () => update(s => { s.drag = null; s.drop = null; }) : undefined}
        onClick=${() => openTask(t.id)}>
        <button class="check" aria-label=${done ? '未完了に戻す' : '完了にする'} title=${done ? '未完了に戻す' : '完了にする'}
          onClick=${e => { e.stopPropagation(); if (done) uncomplete(t); else complete(t); }}>
          <span class="circle"></span><${Icon} n="check" cls="tick" />
        </button>
        <div class="t-body">
          <div class="t-title">${t.title}</div>
          ${t.details && !done && html`<div class="t-details">${t.details}</div>`}
          <div class="t-meta">
            ${showList && html`<span class="chip list">${listName(t.listId)}</span>`}
            ${t.due && !done && html`<span class=${'chip' + (overdue ? ' red' : isToday ? ' today' : '')}><${Icon} n="event" />${dueLabel(t)}${overdue ? ' 期限切れ' : ''}${t.repeat && html`<${Icon} n="repeat" />`}</span>`}
            ${showWho && !done && html`<span class="chip who"><${Avatar} id=${t.assignee} size=${18} />${memberName(t.assignee)}</span>`}
            ${t.status === 'doing' && !done && html`<span class="chip doing">進行中</span>`}
            ${allKids.length > 0 && html`<span class="chip" title="サブタスク"><${Icon} n="subdirectory_arrow_right" />${doneKids}/${allKids.length}</span>`}
            ${done && t.completedAt && html`<span class="muted" style="font-size:12px">完了: ${fmtAt(t.completedAt)}${t.completedBy && memberName(t.completedBy) ? '（' + memberName(t.completedBy) + '）' : ''}</span>`}
          </div>
          ${t.noteText && !done && html`<div class="t-note"><${Icon} n="chat" /><div class="grow" style="min-width:0"><div class="txt">${t.noteText}</div><div class="muted">${memberName(t.noteBy)}・${fmtRel(t.noteAt)}</div></div></div>`}
        </div>
        ${!done && html`<button class=${'star' + (t.starred ? ' on' : '')} aria-label=${t.starred ? 'スターを外す' : 'スターを付ける'} onClick=${e => { e.stopPropagation(); toggleStar(t); }}><${Icon} n=${t.starred ? 'star' : 'star_border'} /></button>`}
        <button class="more" aria-label="タスクのメニュー" onClick=${e => { e.stopPropagation(); openPop(e, 'taskMenu', { id: t.id }); }}><${Icon} n="more_vert" /></button>
      </div>
      ${openKids.map(c => html`<${TaskRow} key=${c.id} task=${c} sub />`)}
    </div>`;
  }

  /* ---------- タスクの追加（その場で入力） ---------- */
  function AddForm({ listId, onClose, inDialog }) {
    const [title, setTitle] = useState('');
    const [details, setDetails] = useState('');
    const [due, setDue] = useState({ due: '', dueTime: '', repeat: '' });
    const [assignee, setAssignee] = useState(S.operator || '');
    const [lid, setLid] = useState(listId || (CUR.listArr[0] && CUR.listArr[0].id));
    const [err, setErr] = useState('');
    const titleRef = useRef(null);
    const boxRef = useRef(null);
    useEffect(() => { if (titleRef.current) titleRef.current.focus(); }, []);
    useEffect(() => {
      if (inDialog) return undefined;
      const h = e => {
        if (!boxRef.current || boxRef.current.contains(e.target)) return;
        if (e.target.closest && e.target.closest('.popover, .pop-scrim, .dialog, .dlg-scrim')) return;
        if (!titleRef.current || !titleRef.current.value.trim()) onClose();
      };
      document.addEventListener('mousedown', h);
      return () => document.removeEventListener('mousedown', h);
    }, []);
    const submit = () => {
      const tt = title.trim();
      if (!tt) { setErr('title'); if (titleRef.current) titleRef.current.focus(); return false; }
      if (!assignee) { setErr('who'); return false; }
      if (!due.due) { setErr('due'); return false; }
      act.createTask({ id: uid(), listId: lid, title: tt, details: details.trim(), assignee: assignee, due: due.due, dueTime: due.dueTime, repeat: due.repeat, sortOrder: newSortOrder(lid) });
      setTitle('');
      setDetails('');
      setErr('');
      if (titleRef.current) titleRef.current.focus();
      return true;
    };
    const errMsg = { title: 'タスク名（何を）を入れてください', who: '担当者（誰が）を選んでください', due: '期限（いつまでに）を選んでください' }[err];
    const form = html`<div class="add-form" ref=${boxRef} style=${inDialog ? 'border:0;padding:0' : ''}>
      ${!inDialog && html`<div class="ph"><span></span></div>`}
      <div class="af-body">
        <input ref=${titleRef} class="af-title" placeholder="タイトル（何を）" value=${title}
          onInput=${e => { setTitle(e.target.value); if (err === 'title') setErr(''); }}
          onKeyDown=${e => {
            if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); const ok = submit(); if (ok && inDialog) onClose(); }
            if (e.key === 'Escape' && !inDialog) { e.stopPropagation(); onClose(); }
          }} />
        <input class="af-details" placeholder="詳細（どのように・任意）" value=${details} onInput=${e => setDetails(e.target.value)}
          onKeyDown=${e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); const ok = submit(); if (ok && inDialog) onClose(); } }} />
        <div class="af-chips">
          <button class=${'chip-btn' + (due.due ? ' set' : '') + (err === 'due' ? ' error' : '')}
            onClick=${e => openPop(e, 'date', { value: due, required: true, allowRepeat: true, onChange: v => { setDue(prev => Object.assign({}, prev, v)); setErr(''); } })}>
            <${Icon} n="event" />${due.due ? dueLabel(due) : '期限（いつまでに）'}${due.repeat && html`<${Icon} n="repeat" />`}
          </button>
          <button class=${'chip-btn' + (assignee ? ' set' : '') + (err === 'who' ? ' error' : '')}
            onClick=${e => openPop(e, 'member', { value: assignee, onChange: v => { setAssignee(v); setErr(''); } })}>
            ${assignee ? html`<${Avatar} id=${assignee} size=${20} />` : html`<${Icon} n="person" />`}${assignee ? memberName(assignee) : '担当者（誰が）'}
          </button>
          ${inDialog && html`<select class="input" style="width:auto;height:32px;padding:0 8px" value=${lid} onChange=${e => setLid(e.target.value)}>
            ${CUR.listArr.map(l => html`<option value=${l.id}>${l.name}</option>`)}
          </select>`}
        </div>
        ${errMsg ? html`<div class="af-err">${errMsg}</div>` : html`<div class="af-hint">Enterで登録。誰が・いつまでに・何を、の3つが必要です</div>`}
        ${inDialog && html`<div class="dlg-actions"><button class="btn text" onClick=${onClose}>キャンセル</button><button class="btn primary" onClick=${() => { if (submit()) onClose(); }}>作成</button></div>`}
      </div>
    </div>`;
    return form;
  }

  /* ---------- 詳細パネル ---------- */
  function DetailPanel({ id }) {
    const t = CUR.tasks[id];
    const [detail, setDetail] = useState(null);
    const [note, setNote] = useState('');
    const [reason, setReason] = useState(null);
    const [reasonText, setReasonText] = useState('');
    const [subTitle, setSubTitle] = useState('');
    const subRef = useRef(null);
    const ver = t ? t.version + ':' + (t.noteAt || '') : '';
    useEffect(() => {
      if (!t || t._pending) return undefined;
      let alive = true;
      call('taskDetail', { id: id }).then(d => { if (alive) setDetail(d); }).catch(() => {});
      return () => { alive = false; };
    }, [id, ver]);

    const close = () => update(s => { s.selected = null; s.remote = null; });
    if (!t) {
      return html`<aside class="panel"><div class="panel-head"><button class="icon-btn" aria-label="閉じる" onClick=${close}><${Icon} n="close" /></button></div>
        <div class="panel-body"><div class="notice warn">このタスクは削除されたか、見つかりません。${S.remote && S.remote.deleted ? '（' + memberName(S.remote.by) + 'さんが削除しました）' : ''}</div></div></aside>`;
    }
    const top = !t.parentId;
    const parent = t.parentId ? CUR.tasks[t.parentId] : null;
    const kids = CUR.children[t.id] || [];
    const overdue = isOverdue(t);
    const remote = S.remote && S.remote.id === id && !S.remote.deleted ? S.remote : null;
    const notes = (detail && detail.id === id ? detail.notes : []).slice();
    if (t.noteText && (!notes.length || notes[0].at !== t.noteAt)) notes.unshift({ id: 'pending', text: t.noteText, by: t.noteBy, at: t.noteAt, pending: !!t._notePending });
    const hist = detail && detail.id === id ? detail.history : null;

    const sendNote = () => {
      const v = note.trim();
      if (!v) return;
      act.addNote(id, v);
      setNote('');
    };
    const changeDue = v => {
      const patch = {};
      if ('due' in v && v.due !== t.due) patch.due = v.due;
      if ('dueTime' in v && v.dueTime !== t.dueTime) patch.dueTime = v.dueTime;
      if ('repeat' in v && v.repeat !== t.repeat) patch.repeat = v.repeat;
      if (!Object.keys(patch).length) return;
      if (patch.due && t.due && patch.due > t.due && top) { setReason({ from: t.due, to: patch.due }); setReasonText(''); }
      act.updateTask(id, patch);
    };
    const addSub = () => {
      const v = subTitle.trim();
      if (!v) return;
      const max = kids.reduce((a, c) => Math.max(a, c.sortOrder || 0), 0);
      act.createTask({ id: uid(), parentId: id, listId: t.listId, title: v, sortOrder: max + 1024 });
      setSubTitle('');
    };
    const setStatus = s => {
      if (s === t.status) return;
      if (s === 'done') complete(t);
      else act.updateTask(id, { status: s });
    };

    return html`<aside class="panel" aria-label="タスクの詳細">
      <div class="panel-head">
        <button class="icon-btn" aria-label="閉じる" onClick=${close}><${Icon} n=${window.innerWidth <= 900 ? 'arrow_back' : 'close'} /></button>
        ${top
          ? html`<select class="input" style="width:auto;height:36px" aria-label="リスト" value=${t.listId} onChange=${e => act.updateTask(id, { listId: e.target.value })}>
              ${CUR.listArr.map(l => html`<option value=${l.id}>${l.name}</option>`)}
            </select>`
          : html`<div class="p-parent"><${Icon} n="subdirectory_arrow_right" />サブタスク：<a onClick=${() => parent && openTask(parent.id)}>${parent ? parent.title : ''}</a></div>`}
        <span class="grow"></span>
        <button class=${'star' + (t.starred ? ' on' : '')} style="opacity:1" aria-label="スター" onClick=${() => toggleStar(t)}><${Icon} n=${t.starred ? 'star' : 'star_border'} /></button>
        <button class="icon-btn" aria-label="削除" title="削除" onClick=${() => act.deleteTask(t)}><${Icon} n="delete" /></button>
      </div>
      <div class="panel-body">
        ${remote && html`<div class="remote"><${Icon} n="sync" /><span>${memberName(remote.by) || 'ほかの人'}さんがこのタスクを更新しました（${fmtRel(new Date(remote.at).toISOString())}）。最新の内容を表示しています。</span></div>`}
        <div class="p-title-row">
          <button class="check" aria-label="完了" onClick=${() => (t.status === 'done' ? uncomplete(t) : complete(t))}>
            <span class="circle" style=${t.status === 'done' ? 'background:var(--primary);border-color:var(--primary)' : ''}></span>
            <${Icon} n="check" cls="tick" />
          </button>
          <${EditableText} key=${id + ':title'} value=${t.title} cls="p-title" single placeholder="タイトル（何を）"
            onSave=${v => { if (v.trim()) act.updateTask(id, { title: v.trim() }); }} />
        </div>
        <${EditableText} key=${id + ':details'} value=${t.details || ''} cls="p-details" placeholder="詳細を追加（どのように・任意）"
          onSave=${v => act.updateTask(id, { details: v })} />

        <div class="field">

            ${t.repeat && html`<span class="muted" style="display:inline-flex;align-items:center;gap:4px"><${Icon} n="repeat" />${repeatLabel(t.repeat)}</span>`}

        </div>
        ${reason && html`<div class="reason">
          <div style="font-size:13px;font-weight:600;margin-bottom:6px">期限を ${mdLabel(reason.from)} → ${mdLabel(reason.to)} に延ばしました。理由を残しますか？（任意）</div>

            <button class="btn text sm" onClick=${() => setReason(null)}>残さない</button>
